services: 
  db:
    image: postgres
    environment:
      POSTGRES_PASSWORD: devpass
      POSTGRES_USER: admin
      POSTGRES_DB: the-good-corner
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U admin -d the-good-corner"]
      interval: 10s
      timeout: 5s
      retries: 100
    volumes: 
      - db-data:/var/lib/postgresql/data
  adminer: 
    image: adminer  
    depends_on: 
      db: 
        condition: service_healthy
  backend: 
    build: ./backend   
    volumes: 
      - ./backend/src:/app/src
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    healthcheck: 
      test: 'curl --fail --request POST --header ''content-type: application/json'' --url ''http://localhost:4000'' --data ''{"query":"query { __typename }"}'' || exit 1'
      interval: 1s
      timeout: 2s
      retries: 100
    depends_on: 
      db: 
        condition: service_healthy 
  frontend: 
    build: ./frontend
    volumes: 
      - ./frontend/src:/app/src
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    healthcheck:
      test: "curl --fail --request GET --url 'http://localhost:5173' || exit 1"
      interval: 1s
      timeout: 2s
      retries: 100
    depends_on:
      backend: 
        condition: service_healthy
  api-gateway:
    image: nginx
    volumes: 
      - ./ngnix.conf:/etc/nginx/nginx.conf
    ports:
      - 7000:80
    depends_on: 
      backend: 
        condition: service_healthy
      frontend: 
        condition: service_healthy
      img: 
        condition: service_healthy
  img: 
    build: ./img
    healthcheck:
      test: "curl --fail --request GET --url 'http://localhost:4000' || exit 1"
      interval: 1s
      timeout: 2s
      retries: 100
    volumes: 
      - ./img/uploads:/app/uploads
volumes:
  db-data:
